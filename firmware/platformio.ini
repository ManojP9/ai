; PlatformIO project — AI Baby Companion · Phase 1 bring-up firmware
; Board: ESP32-S3-WROOM-1-N16R8 (16MB flash, 8MB octal PSRAM)
;
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor -b 115200

[env:esp32-s3-companion]
platform = espressif32@^6.5.0      ; Arduino-ESP32 core 2.0.x (stable legacy I2S API)
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; N16R8 module: 16MB flash + octal (OPI) PSRAM
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=2

lib_deps =
    adafruit/Adafruit PWM Servo Driver Library @ ^3.0.1
    adafruit/Adafruit NeoPixel @ ^1.12.0
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    claws/BH1750 @ ^1.3.0
    h2zero/NimBLE-Arduino @ ^1.4.1
