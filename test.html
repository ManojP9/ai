<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>3C Foods</title>
<style>
    body{
        margin:0;
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#f8f9fa,#e0eafc);
        font-family:Arial, sans-serif;
    }
    .card{
        background:#fff;
        padding:30px 40px;
        border-radius:16px;
        box-shadow:0 10px 25px rgba(0,0,0,0.1);
        text-align:center;
        max-width:400px;
    }
    h1{
        margin-bottom:20px;
        font-size:24px;
        color:#333;
    }
    .item{
        margin:15px 0;
    }
    .name{
        font-weight:bold;
        font-size:18px;
        color:#222;
    }
    .desc{
        font-size:14px;
        color:#555;
    }
</style>
</head>
<body>

<div class="card">
    <h1>Top 3 Foods</h1>

    <div class="item">
        <div class="name">Biryani</div>
        <div class="desc">Aromatic rice dish with spices and meat/vegetables</div>
    </div>

    <div class="item">
        <div class="name">Masala Dosa</div>
        <div class="desc">Crispy South Indian crepe served with chutney & sambar</div>
    </div>

    <div class="item">
        <div class="name">Butter Chicken</div>
        <div class="desc">Creamy tomato-based rich chicken curry</div>
    </div>

</div>

</body>
</html>
